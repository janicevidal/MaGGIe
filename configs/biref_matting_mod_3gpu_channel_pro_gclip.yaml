dataset:
  test:
    name: Matting
    root_dir: /data/xiaoshuai/human_matting/val_0729_resized/
    short_size: 512
    alpha_dir_name: alphas
  train:
    name: Matting
    root_dirs:
      - /data/xiaoshuai/human_matting/train_0729_resized/
      - /data/xiaoshuai/human_matting/train_0814_resized/
    random_state: 2026
    crop:
    - 512
    - 512
    flip_p: 0.5
    gamma_p: 0.5
    add_noise_p: 0.3
    jpeg_p: 0.1
    affine_p: 0.8
    alpha_dir_name: alphas

model:
  arch: BiRefNetPro
  weights: /home/zhangxiaoshuai/Checkpoint/HumanMatting/checkpoints/biref_matting_mod_3gpu_channel/last_model.pth
  sync_bn: true
  having_unused_params: false
  encoder: star_matting
  encoder_args:
    embed_dims: 20
    num_layers: [2, 3, 5, 2]
    prm_ratio: [1, 2, 2, 2]
    dr_ratio: [1, 2, 2, 4]
    structure: 'TE'
  decoder: biref_decoder
  decoder_args:
    in_channels: [160, 100, 40, 20]
    ipt_channels: [48, 48, 32, 16, 8]
    out_channels: [160, 96, 48, 24]
    ms_supervision: true
    dec_ipt: true
    out_ref: true

  lambdas_pix_last:
    bce: 0
    mae: 30
    ssim: 5

  pix_loss_weight: 0.5
  gdt_loss_weight: 0.1
  loss_alpha_grad_w: 300.0
  loss_alpha_lap_w: 100.0
  loss_alpha_gradun_w: 10.0
  loss_alpha_lapun_w: 7.5

  use_ddc_loss: false
  
name: biref_matting_mod_3gpu_channel_pro_gclip
output_dir: /home/zhangxiaoshuai/Checkpoint/HumanMatting/checkpoints
test:
  batch_size: 1
  log_iter: 500
  metrics:
  - MAD
  - MSE
  - SAD
  num_workers: 4
  postprocessing: false
  save_dir: /home/zhangxiaoshuai/Checkpoint/HumanMatting/test_channel_pro_gclip
  save_results: true
train:
  batch_size: 64
  log_iter: 50
  max_iter: 100000
  num_workers: 16
  optimizer:
    betas:
    - 0.9
    - 0.999
    lr: 0.001
    momentum: 0.9
    name: adamw
    weight_decay: 0.01
  gradient_clipping:
      enabled: true
  resume: ''
  resume_last: false
  scheduler:
    name: warmup_decay_multi
    warmup_iters: 500
    warmup_factor: 0.001
    delay_iters: 1000
    decay_steps: [100000]
    peak_scale: 0.7
    eta_min: 0.00001
  seed: 1234
  val_best_metric: MAD
  val_dist: true
  val_iter: 500
  val_metrics:
  - MAD
  - MSE
  - SAD
  vis_iter: 500
tensorboard:
  use: true
  log_dir: tensorboard
